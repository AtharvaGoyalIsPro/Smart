<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Smart Container Dashboard</title>
<style>
body{font-family:Arial;background:#071026;color:#fff;padding:16px}
.card{background:#0a1326;padding:16px;border-radius:12px;max-width:900px;margin:auto}
.btn{padding:8px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer;background:#00c0ff;color:#02121f}
.small{font-size:13px;color:#9fb8d6}
.item{background:#0f1b33;padding:12px;margin-top:10px;border-radius:8px}
input{padding:8px;border-radius:6px;border:none;margin-right:8px;background:#0f1b33;color:white;width:100%}
</style>
</head>
<body>
<div class="card">
<h2>Smart Container Dashboard</h2>
<p class="small">Pair once. ESP32 uploads fill% every 10 seconds.</p>

<div id="auth">
 <button id="btnLogin" class="btn">Sign in with Google</button>
</div>

<div id="app" style="display:none">
 <div style="display:flex;justify-content:space-between">
   <div>
     <div id="email"></div>
     <div id="uid" class="small"></div>
   </div>
   <button id="btnLogout" class="btn" style="background:none;border:1px solid #00c0ff;color:#00c0ff">Log out</button>
 </div>

 <hr/>

 <div style="display:flex;gap:12px">
   <input id="name" placeholder="Container name"/>
   <button id="create" class="btn">Create</button>
 </div>

 <div id="list" style="margin-top:12px"></div>

 <h3>Pairing</h3>
 <div id="pairStatus" class="small">—</div>
 <div id="pairNote" class="small"></div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} 
  from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
import {getDatabase,ref,set,onValue,update}
  from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDDkg0sjNL80TeNSV3CejbGmhZN9QxnR00",
 authDomain: "ultrasonic-c1867.firebaseapp.com",
 databaseURL: "https://ultrasonic-c1867-default-rtdb.firebaseio.com",
 projectId: "ultrasonic-c1867",
 storageBucket: "ultrasonic-c1867.firebasestorage.app",
 messagingSenderId: "754300602341",
 appId: "1:754300602341:web:9822d6453942139ef5d10c",
 measurementId: "G-4KC3E3HHB1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getDatabase();

const SERVICE_UUID="12345678-1234-5678-1234-56789abcdef0";
const WRITE_UUID="12345678-1234-5678-1234-56789abcdef1";
const STATUS_UUID="12345678-1234-5678-1234-56789abcdef2";

const authDiv=document.getElementById("auth");
const appDiv=document.getElementById("app");
const email=document.getElementById("email");
const uidEl=document.getElementById("uid");
const list=document.getElementById("list");
const pairStatus=document.getElementById("pairStatus");
const pairNote=document.getElementById("pairNote");

document.getElementById("btnLogin").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
document.getElementById("btnLogout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 if(!user){
   authDiv.style.display="block";
   appDiv.style.display="none";
   return;
 }
 authDiv.style.display="none";
 appDiv.style.display="block";

 email.textContent=user.email;
 uidEl.textContent="UID: "+user.uid;
 loadContainers(user.uid);
});

// Load containers
function loadContainers(uid){
 const r=ref(db,"users/"+uid+"/containers");
 onValue(r,snap=>{
   list.innerHTML="";
   if(!snap.exists())return;
   snap.forEach(c=>{
     addItem(uid,c.key,c.val());
   });
 });
}

// Render item
function addItem(uid,id,data){
 const el=document.createElement("div");
 el.className="item";
 const pct=(data.fillPercent!==undefined)?data.fillPercent.toFixed(1)+"%":"—";
 el.innerHTML=`
  <div style="display:flex;justify-content:space-between">
    <div>
      <b>${data.name}</b>
      <div class="small">ID: ${id}</div>
      <div class="small">Paired: ${data.paired}</div>
    </div>
    <div style="font-size:26px">${pct}</div>
  </div>
 `;
 if(!data.paired){
   const b=document.createElement("button");
   b.className="btn";
   b.textContent="Pair";
   b.style.marginTop="10px";
   b.onclick=()=>pair(uid,id);
   el.appendChild(b);
 }
 list.appendChild(el);
}

// Create container
document.getElementById("create").onclick=()=>{
 const n=document.getElementById("name").value.trim();
 if(!n)return alert("Enter name");
 const id=n.toLowerCase().replace(/\s+/g,"").substring(0,6)+"_"+Math.random().toString(36).substr(2,5);
 set(ref(db,"users/"+auth.currentUser.uid+"/containers/"+id),{
   name:n,
   paired:false,
   fillPercent:0,
   lastUpdate:0
 });
};

// Pair function
async function pair(uid,id){
 pairStatus.textContent="Opening Bluetooth chooser...";
 pairNote.textContent="";
 try{
   const dev=await navigator.bluetooth.requestDevice({
     filters:[{services:[SERVICE_UUID]}],
     optionalServices:[SERVICE_UUID]
   });

   pairStatus.textContent="Connecting...";
   const server=await dev.gatt.connect();
   const svc=await server.getPrimaryService(SERVICE_UUID);
   const writeChar=await svc.getCharacteristic(WRITE_UUID);
   const statusChar=await svc.getCharacteristic(STATUS_UUID);

   await statusChar.startNotifications();
   statusChar.oncharacteristicvaluechanged=e=>{
     const msg=new TextDecoder().decode(e.target.value);
     pairNote.textContent=msg;
     if(msg.includes("WIFI_OK")){
       update(ref(db,"users/"+uid+"/containers/"+id),{paired:true});
       pairStatus.textContent="Paired ✓";
     }
   };

   const ssid=prompt("WiFi SSID:");
   if(!ssid)return;
   const pass=prompt("WiFi password:");
   if(pass===null)return;

   const payload=`${ssid};${pass};${uid};${id}`;
   await writeChar.writeValue(new TextEncoder().encode(payload));

   pairStatus.textContent="Sent WiFi data... waiting for WIFI_OK";
 }catch(err){
   pairStatus.textContent="Error";
   alert(err);
 }
}

if(!navigator.bluetooth){
 document.body.insertAdjacentHTML("afterbegin","<div style='background:#600;padding:10px'>Web Bluetooth not supported</div>");
}
</script>
</body>
</html>
