<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Container — Pair & Dashboard</title>
  <style>
    /* minimal styles derived from your previous dashboard look */
    body{font-family:Inter,system-ui,Arial;background:linear-gradient(#021021,#071826);color:#e6eef8;margin:0;padding:22px}
    .card{max-width:980px;margin:0 auto;background:linear-gradient(#071126,#04101a);padding:20px;border-radius:12px}
    .top{display:flex;justify-content:space-between;align-items:center}
    button{background:#00c0ff;border:none;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
    .devices{margin-top:18px}
    .device{padding:12px;border-radius:10px;background:rgba(255,255,255,0.02);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .small{font-size:13px;color:#9fb8d6}
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <h1>Smart Container</h1>
        <div class="small">Pair new device & view your containers (Google Sign-In required)</div>
      </div>
      <div id="authArea">
        <button id="signInBtn">Sign in with Google</button>
      </div>
    </div>

    <hr style="margin:14px 0;border-color:rgba(255,255,255,0.03)">

    <div style="display:flex;gap:12px;align-items:center">
      <button id="pairBtn">Pair New Device (via Bluetooth)</button>
      <div id="pairStatus" class="small">Not pairing</div>
    </div>

    <div class="devices" id="devicesList"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, update, get, child } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    // ---------- YOUR FIREBASE CONFIG ----------
    const firebaseConfig = {
      apiKey: "AIzaSyDDkg0sjNL80TeNSV3CejbGmhZN9QxnR00",
      authDomain: "ultrasonic-c1867.firebaseapp.com",
      databaseURL: "https://ultrasonic-c1867-default-rtdb.firebaseio.com",
      projectId: "ultrasonic-c1867",
      storageBucket: "ultrasonic-c1867.firebasestorage.app",
      messagingSenderId: "754300602341",
      appId: "1:754300602341:web:9822d6453942139ef5d10c",
      measurementId: "G-4KC3E3HHB1"
    };
    // ------------------------------------------

    // Initialize
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // UI
    const signInBtn = document.getElementById('signInBtn');
    const authArea = document.getElementById('authArea');
    const pairBtn = document.getElementById('pairBtn');
    const pairStatus = document.getElementById('pairStatus');
    const devicesList = document.getElementById('devicesList');

    let currentUser = null;

    signInBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        alert('Sign in failed: ' + e.message);
      }
    });

    // sign out UI toggle
    function renderAuth(user) {
      authArea.innerHTML = '';
      if (user) {
        const nameSpan = document.createElement('span');
        nameSpan.textContent = user.displayName || user.email;
        nameSpan.style.marginRight = '10px';
        const out = document.createElement('button');
        out.textContent = 'Sign out';
        out.onclick = () => signOut(auth);
        authArea.appendChild(nameSpan);
        authArea.appendChild(out);
      } else {
        const btn = document.createElement('button');
        btn.textContent = 'Sign in with Google';
        btn.onclick = () => signInWithPopup(auth, provider);
        authArea.appendChild(btn);
      }
    }

    onAuthStateChanged(auth, user => {
      currentUser = user;
      renderAuth(user);
      if (user) {
        listenToUserDevices(user.uid);
      } else {
        devicesList.innerHTML = '<div class="small">Sign in to see your devices.</div>';
      }
    });

    // LISTEN to /users/<uid>/devices and then render each device with live RTDB listener.
    const deviceListeners = {}; // track listeners to detach if needed
    function listenToUserDevices(uid) {
      const userDevicesRef = ref(db, '/users/' + uid + '/devices');
      onValue(userDevicesRef, snapshot => {
        const val = snapshot.val();
        devicesList.innerHTML = '';
        if (!val) {
          devicesList.innerHTML = '<div class="small">No devices linked. Pair a device to get started.</div>';
          return;
        }
        Object.keys(val).forEach(deviceId => {
          renderDeviceCard(deviceId, uid);
        });
      });
    }

    function renderDeviceCard(deviceId, uid) {
      const node = document.createElement('div');
      node.className = 'device';
      node.id = 'device-' + deviceId;
      node.innerHTML = `<div>
        <div style="font-weight:700">${deviceId}</div>
        <div class="small" id="device-${deviceId}-meta">loading…</div>
      </div>
      <div>
        <div style="font-size:22px;font-weight:800" id="device-${deviceId}-pct">--.-%</div>
      </div>`;
      devicesList.appendChild(node);

      // attach realtime listener to /devices/<deviceId>/data/fillPercent
      const dataRefPath = '/devices/' + deviceId + '/data/fillPercent';
      const dataRef = ref(db, dataRefPath);
      if (deviceListeners[deviceId]) {
        // already listening (unlikely) — don't add duplicate
      } else {
        onValue(dataRef, snap => {
          const v = snap.val();
          const pctEl = document.getElementById('device-' + deviceId + '-pct');
          const metaEl = document.getElementById('device-' + deviceId + '-meta');
          if (v === null || v === undefined) {
            pctEl.textContent = '--.-%';
            metaEl.textContent = 'No data yet';
          } else {
            pctEl.textContent = parseFloat(v).toFixed(1) + '%';
            metaEl.textContent = 'Live — updated';
          }
        });
        deviceListeners[deviceId] = true;
      }
    }

    // --- PAIRING SEQUENCE (Web Bluetooth) ---
    // BLE service/characteristic UUIDs must match the ESP
    const SERVICE_UUID = '3c3a1f00-8d1c-4d0a-9f8d-4b6f3f6a4a11';
    const CHAR_SSID_UUID = '3c3a1f01-8d1c-4d0a-9f8d-4b6f3f6a4a11';
    const CHAR_PASS_UUID = '3c3a1f02-8d1c-4d0a-9f8d-4b6f3f6a4a11';
    const CHAR_CMD_UUID  = '3c3a1f03-8d1c-4d0a-9f8d-4b6f3f6a4a11';

    pairBtn.addEventListener('click', async () => {
      if (!currentUser) return alert('Please sign in with Google first.');
      try {
        pairStatus.textContent = 'Scanning for SmartContainer devices…';
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        pairStatus.textContent = 'Connecting to device…';
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        const charSSID = await service.getCharacteristic(CHAR_SSID_UUID);
        const charPASS = await service.getCharacteristic(CHAR_PASS_UUID);
        const charCMD  = await service.getCharacteristic(CHAR_CMD_UUID);

        // Read deviceID from the CMD char (device set it initially)
        let deviceID = '';
        try {
          const val = await charCMD.readValue();
          const decoder = new TextDecoder('utf-8');
          deviceID = decoder.decode(val);
        } catch (e) {
          console.warn('Could not read deviceID from CMD characteristic', e);
        }
        if (!deviceID) {
          // fallback to device.name
          deviceID = device.name || ('CNTR-' + Math.random().toString(36).substr(2,6).toUpperCase());
        }

        // Ask user for WiFi credentials (simple prompt for MVP)
        const ssid = prompt('Enter your Wi-Fi SSID (home network name):');
        if (!ssid) { pairStatus.textContent = 'Pair cancelled'; return; }
        const pass = prompt('Enter Wi-Fi password: (leave blank for open network)');
        pairStatus.textContent = 'Sending credentials to device…';

        // write SSID
        const encoder = new TextEncoder();
        await charSSID.writeValue(encoder.encode(ssid));
        await new Promise(r => setTimeout(r, 200));
        await charPASS.writeValue(encoder.encode(pass || ''));

        pairStatus.textContent = 'Waiting for device to connect to Wi-Fi…';

        // Subscribe to notifications on CMD characteristic to receive CONNECTING/OK/FAIL
        await charCMD.startNotifications();
        charCMD.addEventListener('characteristicvaluechanged', async (evt) => {
          const decoder = new TextDecoder('utf-8');
          const msg = decoder.decode(evt.target.value);
          console.log('CMD notification:', msg);
          if (msg === 'CONNECTING') {
            pairStatus.textContent = 'Device connecting to Wi-Fi…';
          } else if (msg === 'OK') {
            pairStatus.textContent = 'Paired & Wi-Fi connected! Claiming device...';
            // Claim device in Firebase: /users/<uid>/devices/<deviceID> = true and /devices/<deviceID>/owner = uid
            const userDevicesPath = '/users/' + currentUser.uid + '/devices/' + deviceID;
            const ownerPath = '/devices/' + deviceID + '/owner';
            await set(ref(db, userDevicesPath), true);
            await set(ref(db, ownerPath), currentUser.uid);
            pairStatus.textContent = 'Device claimed. It will appear on your dashboard shortly.';
            // disconnect from device
            try { server.disconnect(); } catch(e){}
            await charCMD.stopNotifications();
          } else if (msg === 'FAIL') {
            pairStatus.textContent = 'Wi-Fi connect failed. Check credentials and try again.';
            await charCMD.stopNotifications();
          }
        });

      } catch (err) {
        console.error(err);
        pairStatus.textContent = 'Pairing failed: ' + err.message;
      }
    });

    // Simple initial content
    devicesList.innerHTML = '<div class="small">Sign in to get started. After pairing a device, it will appear here.</div>';
  </script>
</body>
</html>
