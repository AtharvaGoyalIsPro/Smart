<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Containers — Dashboard</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#071026;color:#e6eef8;margin:18px}
    .card{background:#071126;padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);max-width:980px;margin:10px auto}
    .btn{padding:8px 12px;border-radius:8px;border:none;background:#00c0ff;color:#051423;font-weight:700;cursor:pointer}
    .small{font-size:13px;color:#9fb8d6}
    input{padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:inherit}
    .containerItem{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;margin-top:8px}
    code{background:rgba(255,255,255,0.03);padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Smart Containers</h2>
      <div id="authArea"><button id="btnSignIn" class="btn">Sign in with Google</button></div>
    </div>
    <p class="small">Sign in, create containers and pair a container with your device once. After pairing the device will upload fill% every 10s to Firebase.</p>

    <div id="app" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div id="userEmail" style="font-weight:700"></div>
          <div id="userUid" class="small"></div>
        </div>
        <div><button id="btnSignOut" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.03);color:#00c0ff">Sign out</button></div>
      </div>

      <hr/>

      <div style="display:flex;gap:12px">
        <div style="flex:1">
          <div style="display:flex;gap:8px">
            <input id="newName" placeholder="Container name (e.g. Rice)" />
            <button id="btnCreate" class="btn">Create</button>
          </div>
          <div id="containersList" style="margin-top:12px"></div>
        </div>

        <div style="width:300px">
          <div class="small" style="background:rgba(255,255,255,0.02);padding:10px;border-radius:8px">
            <div style="font-weight:700">Pairing</div>
            <div id="pairStatus" style="margin-top:8px">—</div>
            <div id="pairNotify" class="small" style="margin-top:6px"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="signedOut" class="small" style="margin-top:12px">Please sign in to see your containers.</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDkg0sjNL80TeNSV3CejbGmhZN9QxnR00",
      authDomain: "ultrasonic-c1867.firebaseapp.com",
      databaseURL: "https://ultrasonic-c1867-default-rtdb.firebaseio.com",
      projectId: "ultrasonic-c1867",
      storageBucket: "ultrasonic-c1867.firebasestorage.app",
      messagingSenderId: "754300602341",
      appId: "1:754300602341:web:9822d6453942139ef5d10c",
      measurementId: "G-4KC3E3HHB1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // UI
    const btnSignIn = document.getElementById('btnSignIn');
    const btnSignOut = document.getElementById('btnSignOut');
    const authArea = document.getElementById('authArea');
    const appDiv = document.getElementById('app');
    const userEmail = document.getElementById('userEmail');
    const userUid = document.getElementById('userUid');
    const containersList = document.getElementById('containersList');
    const newName = document.getElementById('newName');
    const pairStatus = document.getElementById('pairStatus');
    const pairNotify = document.getElementById('pairNotify');

    // BLE UUIDs
    const SERVICE_UUID = "12345678-1234-5678-1234-56789abcdef0";
    const CHAR_WRITE_UUID = "12345678-1234-5678-1234-56789abcdef1";
    const CHAR_STATUS_UUID = "12345678-1234-5678-1234-56789abcdef2";

    let currentUid = null;

    btnSignIn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        alert('Sign in failed: ' + e.message);
      }
    });
    btnSignOut.addEventListener('click', async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUid = user.uid;
        userEmail.textContent = user.email || user.displayName;
        userUid.textContent = "UID: " + user.uid;
        document.getElementById('signedOut').style.display = 'none';
        authArea.style.display = 'none';
        appDiv.style.display = 'block';
        listenContainers(user.uid);
      } else {
        currentUid = null;
        appDiv.style.display = 'none';
        authArea.style.display = 'block';
        document.getElementById('signedOut').style.display = 'block';
        containersList.innerHTML = '';
      }
    });

    // Generate container id
    function generateId(name) {
      const s = (name||'ct').replace(/\s+/g,'').toLowerCase().substring(0,6);
      return s + "_" + Math.random().toString(36).substring(2,7).toUpperCase();
    }

    // Create container
    document.getElementById('btnCreate').addEventListener('click', async () => {
      if (!currentUid) return alert('Sign in first');
      const name = newName.value.trim() || 'container';
      const id = generateId(name);
      const obj = { name: name, paired: false, fillPercent: 0, lastUpdate: 0, created: Date.now() };
      try {
        await set(ref(db, 'users/' + currentUid + '/containers/' + id), obj);
        newName.value = '';
      } catch (e) {
        alert('Create failed: ' + e.message);
      }
    });

    // Listen containers
    function listenContainers(uid) {
      const topRef = ref(db, 'users/' + uid + '/containers');
      onValue(topRef, snapshot => {
        containersList.innerHTML = '';
        if (!snapshot.exists()) return;
        snapshot.forEach(child => {
          renderContainer(child.key, child.val());
        });
      });
    }

    function renderContainer(id, data) {
      const el = document.createElement('div');
      el.className = 'containerItem';
      const name = data.name || id;
      const filled = (data.fillPercent !== undefined) ? Number(data.fillPercent).toFixed(1) + '%' : '—';
      const paired = data.paired ? 'Yes' : 'No';
      const last = data.lastUpdate ? new Date(Number(data.lastUpdate) * 1000).toLocaleString() : '—';

      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="flex:1">
            <div style="font-weight:700">${name}</div>
            <div class="small">ID: <code>${id}</code></div>
            <div class="small">Paired: ${paired} • Last: ${last}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:28px;font-weight:800">${filled}</div>
            <div class="small">fill</div>
            <div style="margin-top:8px"></div>
          </div>
        </div>
      `;

      // Add pair button if not paired
      if (!data.paired) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = 'Pair';
        btn.style.marginTop = '10px';
        btn.onclick = () => pairContainer(id, name);
        el.appendChild(btn);
      }

      containersList.prepend(el);
    }

    // Pairing flow: requestDevice() must be called inside the click handler
    async function pairContainer(containerId, containerName) {
      if (!currentUid) return alert('Sign in first');

      pairStatus.textContent = 'Opening Bluetooth chooser...';
      pairNotify.textContent = '';

      try {
        // (A) requestDevice MUST be inside the user gesture
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        pairStatus.textContent = 'Connecting to device...';
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);
        const statusChar = await service.getCharacteristic(CHAR_STATUS_UUID);

        // Subscribe to notifications
        await statusChar.startNotifications();
        statusChar.addEventListener('characteristicvaluechanged', (evt) => {
          const s = new TextDecoder().decode(evt.target.value);
          pairNotify.textContent = s;
          console.log('status notify', s);
          if (s.includes('WIFI_OK')) {
            // mark paired true in DB
            update(ref(db, 'users/' + currentUid + '/containers/' + containerId), { paired: true })
              .catch(err => console.warn('Failed to update paired flag:', err));
            pairStatus.textContent = 'Paired (WIFI_OK)';
          } else if (s.includes('WIFI_FAIL')) {
            pairStatus.textContent = 'Device WiFi failed';
          }
        });

        // (B) After device selected, now ask for WiFi info (doesn't break gesture)
        const ssid = prompt('Enter WiFi SSID (home network):');
        if (!ssid) {
          pairStatus.textContent = 'WiFi SSID not provided';
          return;
        }
        const password = prompt('Enter WiFi password (leave blank for open):');
        if (password === null) {
          pairStatus.textContent = 'WiFi password cancelled';
          return;
        }

        // Send onboarding payload: SSID;PASSWORD;UID;CONTAINER_ID
        const payload = `${ssid};${password};${currentUid};${containerId}`;
        const encoded = new TextEncoder().encode(payload);
        await writeChar.writeValue(encoded);

        pairStatus.textContent = 'Onboarding data sent — waiting for device...';
        alert('Onboarding sent. Wait for device to report WIFI_OK.');

      } catch (err) {
        console.error(err);
        pairStatus.textContent = 'Pairing failed';
        pairNotify.textContent = err.message || err;
        alert('Pairing failed: ' + (err.message || err));
      }
    }

    // Feature detection
    if (!('bluetooth' in navigator)) {
      document.body.insertAdjacentHTML('afterbegin', '<div style="background:#601010;padding:10px;color:#fff">Web Bluetooth not supported in this browser. Use Chrome/Edge on Android or desktop.</div>');
    }
  </script>
</body>
</html>
