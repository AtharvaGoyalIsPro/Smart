<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Container - Pair & Dashboard</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:18px;background:#f6fafc;color:#04263a}
    .card{background:white;padding:16px;border-radius:8px;box-shadow:0 6px 18px rgba(2,6,23,0.08);max-width:900px;margin:12px auto}
    button{padding:8px 12px;border-radius:6px;border:0;background:#0366d6;color:white;cursor:pointer}
    input{padding:8px;border-radius:6px;border:1px solid #d1e3f0;width:100%}
    label{display:block;margin-top:8px;font-weight:600}
    .row{display:flex;gap:12px}
    .col{flex:1}
    pre{background:#f3f7fb;padding:8px;border-radius:6px;overflow:auto}
  </style>
</head>
<body>
  <div class="card">
    <h2>Smart Container — Pair & Dashboard</h2>
    <p>Login with Google, then click <b>Add Smart Container</b> to start BLE provisioning.</p>

    <div id="authArea">
      <div id="userBox">
        <button id="loginBtn">Sign in with Google</button>
        <button id="logoutBtn" style="display:none">Sign out</button>
        <div id="userInfo" style="margin-top:12px"></div>
      </div>
    </div>

    <hr/>

    <div id="pairArea" style="display:none">
      <h3>Pair a new container</h3>
      <label>Wi-Fi SSID
        <input id="ssid" placeholder="Your Wi-Fi SSID"/>
      </label>
      <label>Wi-Fi Password
        <input id="pass" placeholder="Wi-Fi password (sent over BLE)"/>
      </label>

      <div style="margin-top:12px">
        <button id="scanBtn">Add Smart Container (BLE scan)</button>
      </div>

      <div id="pairLog" style="margin-top:12px"><pre id="log">Ready.</pre></div>
    </div>

    <hr/>

    <div id="dashboardArea" style="display:none">
      <h3>Your Containers</h3>
      <div id="containers"></div>
    </div>
  </div>

  <!-- Firebase SDK (modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getDatabase, ref, onValue, set, push, remove, get, child
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    // ---- use your Firebase config (from your uploaded file) ----
    const firebaseConfig = {
      apiKey: "AIzaSyDDkg0sjNL80TeNSV3CejbGmhZN9QxnR00",
      authDomain: "ultrasonic-c1867.firebaseapp.com",
      databaseURL: "https://ultrasonic-c1867-default-rtdb.firebaseio.com",
      projectId: "ultrasonic-c1867",
      storageBucket: "ultrasonic-c1867.appspot.com",
      messagingSenderId: "754300602341",
      appId: "1:754300602341:web:9822d6453942139ef5d10c",
      measurementId: "G-4KC3E3HHB1"
    };
    // ----------------------------------------------------------

    // UI elements
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfo = document.getElementById('userInfo');
    const pairArea = document.getElementById('pairArea');
    const dashboardArea = document.getElementById('dashboardArea');
    const scanBtn = document.getElementById('scanBtn');
    const logEl = document.getElementById('log');
    const ssidEl = document.getElementById('ssid');
    const passEl = document.getElementById('pass');
    const containersDiv = document.getElementById('containers');

    function log(msg){ const t = new Date().toLocaleTimeString(); logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent; }

    // init firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // auth handlers
    loginBtn.onclick = async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (e) { alert('Sign-in failed: ' + e.message); }
    };
    logoutBtn.onclick = async () => { await signOut(auth); };

    onAuthStateChanged(auth, user => {
      if (user) {
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        userInfo.textContent = `Signed in: ${user.displayName} (${user.email})`;
        pairArea.style.display = 'block';
        dashboardArea.style.display = 'block';
        startDashboardForUser(user.uid);
      } else {
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        userInfo.textContent = '';
        pairArea.style.display = 'none';
        dashboardArea.style.display = 'none';
        containersDiv.innerHTML = '';
      }
    });

    // Utility: generate simple random claim token (UUID-like)
    function makeClaimToken(){
      return 'ct-' + ([1,1,1,1].map(()=> Math.random().toString(16).slice(2,10)).join('-'));
    }

    // BLE provisioning constants (must match ESP32 service + characteristic UUIDs)
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e'; // example NUS-like
    const CHAR_SSID_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const CHAR_PASS_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
    const CHAR_TOKEN_UUID = '6e400004-b5a3-f393-e0a9-e50e24dcca9e';
    const CHAR_INFO_UUID = '6e400005-b5a3-f393-e0a9-e50e24dcca9e'; // read deviceId

    // When user clicks scan -> connect flow
    scanBtn.onclick = async () => {
      if (!auth.currentUser) { alert('Sign in first'); return; }
      const ssid = ssidEl.value.trim();
      const pwd = passEl.value;
      if (!ssid) { alert('Enter Wi-Fi SSID'); return; }

      log('Starting BLE scan (choose your device when prompted)...');
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{services:[SERVICE_UUID]}],
          optionalServices: [SERVICE_UUID]
        });
        log('Selected device: ' + device.name);
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        // read device info (deviceId)
        let deviceId = 'unknown-device';
        try {
          const infoChar = await service.getCharacteristic(CHAR_INFO_UUID);
          const infoVal = await infoChar.readValue();
          deviceId = new TextDecoder().decode(infoVal) || deviceId;
          log('Device UID: ' + deviceId);
        } catch(e) { log('Could not read device info: ' + e.message); }

        // write SSID
        const ssidChar = await service.getCharacteristic(CHAR_SSID_UUID);
        await ssidChar.writeValue(new TextEncoder().encode(ssid));
        log('Sent SSID over BLE');

        // write PASS (if empty, send empty string)
        const passChar = await service.getCharacteristic(CHAR_PASS_UUID);
        await passChar.writeValue(new TextEncoder().encode(pwd || ''));
        log('Sent Wi-Fi password over BLE');

        // write claim token
        const claimToken = makeClaimToken();
        const tokenChar = await service.getCharacteristic(CHAR_TOKEN_UUID);
        await tokenChar.writeValue(new TextEncoder().encode(claimToken));
        log('Sent claim token: ' + claimToken);

        // Now wait for the device to appear in /unclaimed/<deviceId> with matching token
        log('Waiting for device to register itself in Firebase (/unclaimed/' + deviceId + ')');
        await waitForClaim(deviceId, claimToken, auth.currentUser.uid);
        log('Device successfully claimed and linked to your account.');

        // disconnect BLE
        try { server.disconnect(); } catch(e){}
      } catch (err) {
        console.error(err);
        alert('BLE provisioning failed: ' + (err.message || err));
        log('BLE provisioning error: ' + (err.message || err));
      }
    };

    // Wait for device write to /unclaimed/<deviceId> with the expected token,
    // then move the entry to /users/<uid>/containers/<deviceId>
    function waitForClaim(deviceId, claimToken, uid){
      return new Promise((resolve, reject) => {
        const unclaimedRef = ref(db, '/unclaimed/' + deviceId);
        const timeout = setTimeout(()=> {
          // stop listening after 2 minutes
          offListener();
          reject(new Error('Timed out waiting for device to register.'));
        }, 120000);

        function offListener(){ onVal && onVal(); clearTimeout(timeout); }

        // listen for unclaimed/<deviceId>
        let onVal = onValue(unclaimedRef, async (snap) => {
          if (!snap.exists()) return;
          const data = snap.val();
          if (!data || data.claimToken !== claimToken) {
            log('Found unclaimed entry but token mismatch or missing. Waiting...');
            return;
          }
          // token matches -> move under user
          try {
            const userPath = '/users/' + uid + '/containers/' + deviceId;
            await set(ref(db, userPath), data);
            await remove(unclaimedRef);
            log('Moved device to ' + userPath);
            offListener();
            resolve();
          } catch (e) {
            offListener();
            reject(e);
          }
        }, (err) => {
          offListener();
          reject(err);
        });
      });
    }

    // DASHBOARD: show user containers and live percent
    function startDashboardForUser(uid){
      const userContainersRef = ref(db, '/users/' + uid + '/containers');
      // update UI when containers list changes
      onValue(userContainersRef, (snap) => {
        containersDiv.innerHTML = '';
        if (!snap.exists()) { containersDiv.textContent = 'No containers yet.'; return; }
        const data = snap.val();
        for (const id in data) {
          addOrUpdateContainerUI(uid, id, data[id]);
        }
      });
    }

    // create UI widget for a container and attach realtime listener for percent
    function addOrUpdateContainerUI(uid, deviceId, meta){
      const widgetId = 'container-' + deviceId;
      let widget = document.getElementById(widgetId);
      if (!widget) {
        widget = document.createElement('div');
        widget.id = widgetId;
        widget.style.border = '1px solid #e6f0f8';
        widget.style.padding = '10px';
        widget.style.marginBottom = '8px';
        widget.style.borderRadius = '6px';
        containersDiv.appendChild(widget);
      }
      widget.innerHTML = `<strong>${meta.name || deviceId}</strong> — <span id="${widgetId}-status">Initialising...</span>
        <div style="margin-top:8px"><div id="${widgetId}-bar" style="height:12px;background:#e9f6ff;border-radius:6px;overflow:hidden">
        <div id="${widgetId}-fill" style="height:12px;width:0%;background:#0366d6"></div></div>
        <div style="margin-top:6px">Last: <span id="${widgetId}-last">—</span></div></div>`;

      // listen to percent at /users/<uid>/containers/<deviceId>/percent
      const pctRef = ref(db, '/users/' + uid + '/containers/' + deviceId + '/percent');
      onValue(pctRef, (snap) => {
        const elStatus = document.getElementById(widgetId + '-status');
        const elFill = document.getElementById(widgetId + '-fill');
        const elLast = document.getElementById(widgetId + '-last');
        if (!snap.exists()) {
          elStatus.textContent = 'No data';
          elFill.style.width = '0%';
          elLast.textContent = '—';
          return;
        }
        const pct = Number(snap.val());
        const clamped = Math.max(0, Math.min(100, isFinite(pct) ? pct : 0));
        elFill.style.width = clamped + '%';
        elStatus.textContent = clamped.toFixed(1) + '%';
        elLast.textContent = new Date().toLocaleString();
      });
    }

    // Helper: onValue returns unsubscribe function but Firebase modular onValue returns the unsubscribe when called
    function onValueRef(r, cb, err) {
      return onValue(r, cb, err);
    }
  </script>
</body>
</html>
